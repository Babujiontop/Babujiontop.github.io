<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIXCOFARM MCFT Testnet</title>
</head>
<body>
  <h1>MIXCOFARM MCFT Testnet</h1>
  <p>Pi Network sign-in callback test page</p>
  <p id="status">Callback page loaded. Login is not verified.</p>
  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    document.getElementById("status").textContent =
      params.has("access_token")
        ? "Sign-in response detected; verification is still required."
        : "Page loaded successfully. No sign-in response detected.";
    history.replaceState(null, "", location.pathname);
  </script>
</body>
</html>
