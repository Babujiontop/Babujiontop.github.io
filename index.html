<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIXCOFARM MCFT Testnet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 50px; }
    button { background: #34d399; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>MIXCOFARM MCFT Testnet</h1>
  <p>Payments, merchants and financial tools — built for the Pi Testnet prototype.</p>
  <br>
  <button onclick="onSignIn()">Sign in with Pi</button>
  <p id="status" style="margin-top: 20px; color: #fbbf24;"></p>


<script>
  Pi.init({ version: "2.0", sandbox: true });

  async function onSignIn() {
    const statusEl = document.getElementById("status");
    statusEl.innerText = "Authenticating with Pi...";

    try {
      const auth = await Pi.authenticate(
        ["username", "payments"],
        function (incompletePayment) {
          console.log("Incomplete payment:", incompletePayment);
        }
      );

      statusEl.innerText = "Verifying with MIXCOFARM backend...";

      const response = await fetch(
        "https://babujiontop-github-io.onrender.com/api/auth/verify",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            accessToken: auth.accessToken
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Backend verification failed");
      }

      if (data.verified && data.user) {
        statusEl.innerText =
          "Success! Welcome, " + data.user.username;
      } else {
        statusEl.innerText =
          "Verification failed: " + (data.error || "Unknown error");
      }
    } catch (err) {
      console.error("Sign-in error:", err);
      statusEl.innerText =
        "Sign-in error: " + (err.message || "Please try again");
    }
  }
</script>
</body>
</html>
