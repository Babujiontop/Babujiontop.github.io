<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIXCOFARM MCFT Testnet</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 50px; }
    button { background: #34d399; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>MIXCOFARM MCFT Testnet</h1>
  <p>Payments, merchants and financial tools — built for the Pi Testnet prototype.</p>
  <br>
  <button onclick="onSignIn()">Sign in with Pi</button>
  <p id="status" style="margin-top: 20px; color: #fbbf24;"></p>

  <script>
    Pi.init({ version: "2.0", sandbox: true });

    async function onSignIn() {
      const statusEl = document.getElementById("status");
      statusEl.innerText = "Authenticating with Pi...";
      
      try {
        const auth = await Pi.authenticate(["username", "payments"], function(incompletePayment) {
          console.log("Incomplete payment found:", incompletePayment);
        });

        statusEl.innerText = "Token received! Verifying with backend...";

        const response = await fetch("https://mcftapptest.loca.lt/api/auth/verify", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + auth.accessToken,
            "Content-Type": "application/json"
          }
        });

        const data = await response.json();
        if (data.success) {
          statusEl.innerText = "Success! Welcome, " + data.user.username;
        } else {
          statusEl.innerText = "Backend verification failed: " + (data.error || "Unknown error");
        }
      } catch (err) {
        console.error("Auth Error:", err);
        statusEl.innerText = "Pi Auth Error: " + (err.message || JSON.stringify(err));
      }
    }
  </script>
</body>
</html>
